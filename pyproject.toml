# Python environment for the vendored ppt-master SVG -> PPTX exporter.
# Managed with uv: `uv sync` creates .venv with exactly what svg_to_pptx needs.
# The full ppt-master requirement set (PDF/Doc ingestion, TTS, image gen...) is
# intentionally NOT installed — this repo only uses the export stage.
[project]
name = "pptx-generator-exporter"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "python-pptx>=0.6.21",
  "XlsxWriter>=3.0.0",
  "skia-pathops>=0.9.2",
  "uharfbuzz>=0.50.0",
  "Pillow>=9.0.0",
  "numpy>=1.20.0",
  "PyYAML>=6.0",
]

[tool.uv]
package = false
